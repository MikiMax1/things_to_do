<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kingdom of Ashveil</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<h1>Kingdom of Ashveil</h1>
<p class="sub" id="turn-label">Season 1</p>

<svg id="map" viewBox="0 0 280 280"></svg>

<div class="btnrow">
  <button type="button" id="b-farm">Farm</button>
  <button type="button" id="b-house">House</button>
  <button type="button" id="b-market">Market</button>
  <button type="button" id="b-barracks">Barracks</button>
  <button type="button" id="b-tower">Tower</button>
  <button type="button" id="b-clear">Clear</button>
</div>
<p class="selinfo">Building: <b id="sel-label">Farm</b> <span id="sel-cost">(30g)</span></p>

<div class="statgrid">
  <div class="statcard"><p class="lbl">Gold</p><p class="val" id="stat-gold">300</p></div>
  <div class="statcard"><p class="lbl">Food</p><p class="val" id="stat-food">200</p></div>
  <div class="statcard"><p class="lbl">Population</p><p class="val" id="stat-pop">0</p></div>
  <div class="statcard"><p class="lbl">Army</p><p class="val" id="stat-army">10</p></div>
</div>

<button type="button" id="advance" class="wide" style="font-size:14px; font-weight:600; padding:12px; margin-bottom:14px;">Next season</button>

<div class="card">
  <p class="title">Castle tier</p>
  <p style="font-size:14px; font-weight:600; margin:0 0 6px;" id="castle-tier">Wooden hall</p>
  <div class="barwrap"><div class="barfill" id="castle-bar" style="width:0%;"></div></div>
  <button type="button" id="upgrade-castle" class="wide" style="margin-top:8px;">Upgrade castle <span id="upgrade-cost">(150g)</span></button>
</div>

<div class="card">
  <p class="title">Brannoch, the rival kingdom</p>
  <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; font-size:13px;">
    <span>Their strength</span>
    <b id="rival-str">40</b>
  </div>
  <div style="display:grid; grid-template-columns:1fr 1fr; gap:6px;">
    <button type="button" id="act-raid">Raid</button>
    <button type="button" id="act-spy">Spy</button>
    <button type="button" id="act-ally" style="grid-column:1/3;">Offer alliance</button>
  </div>
</div>

<div class="card">
  <p class="title">Quest board</p>
  <div id="quests"></div>
</div>

<div class="card">
  <p class="title">Milestones</p>
  <div id="milestones"></div>
</div>

<div class="card">
  <p class="title">Chronicle</p>
  <div id="log"></div>
</div>

<script src="game.js"></script>
</body>
</html>
